# DurableFlow 示例配置
#
# 使用方式：复制本文件为 config/durableflow.yaml，再按本地环境修改。
# config/durableflow.yaml 不纳入版本控制（见 .gitignore）。
# 命令行选项 --data-dir / --max-concurrency 优先于本文件中的配置。

durableflow:
  storage:
    # 本地持久化数据目录：每个工作流运行对应
    # data-dir/workflows/<runId>.journal（事件日志）与 <runId>.effects（幂等效果存储）
    data-dir: ./data

  execution:
    # 同时运行的步骤数上限
    max-concurrency: 4
